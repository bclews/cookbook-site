name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: '1.22'
  HUGO_VERSION: '0.161.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Verify modules
        run: go mod verify

  smoke-build:
    name: Smoke build (example recipes)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build recipe-tool
        run: CGO_ENABLED=0 go build -o bin/recipe-tool ./cmd/recipe-tool

      - name: Convert example recipes
        run: cd recipe-site && ../bin/recipe-tool convert --yaml-dir ../examples/recipes --skip-images

      - name: Build site
        run: cd recipe-site && hugo --minify

      - name: Verify output
        run: |
          test -f recipe-site/public/index.html || { echo "index.html not generated"; exit 1; }
          pages=$(find recipe-site/public/recipes -name 'index.html' | wc -l)
          [ "$pages" -ge 1 ] || { echo "no recipe pages generated"; exit 1; }
          echo "Generated $pages recipe page(s)"
