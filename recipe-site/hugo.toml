baseURL = "/"
locale = "en-US"
title = "Recipe Collection"

# Build content with today's date (avoids timezone edge cases)
buildFuture = true

# Pagination settings
[pagination]
  pagerSize = 12

# Enable emoji rendering
enableEmoji = true

# Recipe exports (notes, directions) often contain inline HTML. Render it
# instead of silently dropping it. The content is your own and the site is
# self-hosted; the Content-Security-Policy in baseof.html limits what any
# embedded markup can do.
[markup]
  [markup.goldmark.renderer]
    unsafe = true

# Taxonomy settings for tags.
# Keywords are deliberately not a taxonomy: they feed search and SEO metadata
# rather than generating browsable pages (see layouts/index.json and baseof.html).
[taxonomies]
  tag = "tags"

# Menu configuration
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "All Recipes"
    url = "/recipes/"
    weight = 2
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 3

# Site parameters
[params]
  description = "A collection of recipes"
  author = ""

  # Recipe display settings
  showPrepTime = true
  showCookTime = true
  showServings = true
  showNutrition = true

  # Search settings
  enableSearch = true

# Output formats for search index
[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
