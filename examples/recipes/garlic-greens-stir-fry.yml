name: Garlic Greens Stir-Fry
description: A fast side of leafy greens with garlic and soy.
servings: 2 servings
prep_time: PT5M
cook_time: PT5M
tags:
  - Side
  - Quick
  - Vegan
ingredients:
  - 1 tbsp neutral oil
  - 3 cloves garlic, sliced
  - 1 bunch leafy greens (bok choy, kale, or spinach), trimmed
  - 1 tbsp soy sauce
  - 1 tsp sesame oil
directions:
  - Heat the oil in a wok or large pan over high heat.
  - Add the garlic and stir for 15 seconds until fragrant.
  - Add the greens and toss for 2-3 minutes until just wilted.
  - Add the soy sauce and sesame oil, toss once more, and serve.
